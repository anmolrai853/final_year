name: student_planner
description: University Student Timetable & Study Planner App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  icalendar_parser: ^2.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.2
  collection: ^1.18.0
  file_picker: ^10.3.10
  http: ^1.2.0
  google_maps_flutter: ^2.14.0
  geolocator: 14.0.2
  geolocator_android: ^5.0.2
  permission_handler: ^12.0.0
  flutter_polyline_points: ^3.1.0
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/